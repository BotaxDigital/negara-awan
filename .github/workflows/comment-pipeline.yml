name: Comment Pipeline (Auto)

on:
  schedule:
    # Selasa 02:00 WIB (19:00 UTC Selasa) - Scrape & Score
    - cron: '0 19 * * 2'
    # Rabu 02:00 WIB (20:00 UTC Rabu) - Sync Sheet
    - cron: '0 20 * * 3'
    # Minggu 03:00 WIB (20:00 UTC Sabtu) - Render next episode
    - cron: '0 20 * * 6'
  workflow_dispatch:
    inputs:
      step:
        description: 'Pipeline step to run'
        required: true
        type: choice
        options:
          - scrape
          - score
          - sync
          - full

jobs:
  scrape:
    name: Scrape Comments
    if: github.event.inputs.step == 'scrape' || github.event.inputs.step == 'full' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci --prefix tools/comment-scraper
      - name: Run Scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          YOUTUBE_VIDEO_ID: ${{ secrets.YOUTUBE_VIDEO_ID }}
          INSTAGRAM_POST_ID: ${{ secrets.INSTAGRAM_POST_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_POST_ID: ${{ secrets.FACEBOOK_POST_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          TIKTOK_JSON_PATH: ${{ secrets.TIKTOK_JSON_PATH }}
        run: |
          cd tools/comment-scraper
          node index.js
          
  score:
    name: Score Comments (LLM)
    needs: scrape
    if: github.event.inputs.step == 'score' || github.event.inputs.step == 'full' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci --prefix tools/llm-scorer
      - name: Run Scorer
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SCORING_MODEL: ${{ secrets.SCORING_MODEL }}
        run: |
          cd tools/llm-scorer
          node index.js
          
  sync:
    name: Sync Sheet → Episode Data
    needs: score
    if: github.event.inputs.step == 'sync' || github.event.inputs.step == 'full' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci --prefix tools/sheet-sync
      - name: Run Sync
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          cd tools/sheet-sync
          node index.js
          
      - name: Commit Episode Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/episodes/ep*/src/data/*.json
          git diff --staged --quiet || git commit -m "chore: update episode data from comments [skip ci]"
          git push

  render-next:
    name: Render Next Episode
    needs: sync
    if: github.event_name == 'schedule' && github.event.schedule == '0 20 * * 6'
    uses: ./.github/workflows/render-episode.yml
    secrets: inherit
    with:
      episode: 'ep${{ github.run_number }}-auto'
      total_frames: '5400'
